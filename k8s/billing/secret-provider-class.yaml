# Le os segredos do Billing direto do Key Vault (kvfiap) pelo CSI Secrets Store driver, usando a managed identity do
# addon do cluster (a mesma do monolito: o addon ja tem "Key Vault Secrets User" no kvfiap); nao criei Workload Identity
# propria para manter o escopo simples.
#
# userAssignedIdentityID e tenantId sao identificadores estaveis (nao sao segredos): os mesmos literais de
# OficinaMecanica/k8s/oficinamecanica-api/secret-provider-class.yaml, vindos de
# "terraform output key_vault_secrets_provider_client_id" e "terraform output azure_tenant_id" no OficinaMecanica.Infra.
#
# Listo so os 5 secrets que o Billing usa. A conexao com o banco e o BillingDb (usuario dedicado app_billing,
# nunca o admin do servidor). Cada servico monta o proprio SecretProviderClass so com o que consome; a identidade do
# addon enxerga o vault inteiro, entao essa separacao e de manifest, nao de permissao.
#
# secretObjects sincroniza os valores para o Secret nativo "billing-secrets", que o deployment.yaml le por secretKeyRef.
# A sincronizacao so acontece enquanto algum pod monta este SecretProviderClass como volume (ver deployment.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: billing-secrets-provider
  namespace: default
  labels:
    app: oficinamecanica-billing
spec:
  provider: azure
  secretObjects:
    - secretName: billing-secrets
      type: Opaque
      data:
        - objectName: billing-sql-connection-string
          key: billing-sql-connection-string
        - objectName: mercadopago-access-token
          key: mercadopago-access-token
        - objectName: mercadopago-webhook-secret
          key: mercadopago-webhook-secret
        - objectName: rabbitmq-username
          key: rabbitmq-username
        - objectName: rabbitmq-password
          key: rabbitmq-password
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "037343e8-75c0-44d8-bbc4-0074c58402bb"
    keyvaultName: kvfiap
    tenantId: "a1016065-4e6c-4347-b374-25543c9a3425"
    objects: |
      array:
        - |
          objectName: billing-sql-connection-string
          objectType: secret
        - |
          objectName: mercadopago-access-token
          objectType: secret
        - |
          objectName: mercadopago-webhook-secret
          objectType: secret
        - |
          objectName: rabbitmq-username
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
